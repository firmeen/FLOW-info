name: Validate and deploy FLOW website

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify production brand and localized routes
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          check_file() {
            if [ ! -f "$2" ]; then
              echo "::error::$1 missing: $2"
              exit 1
            fi
          }

          check_contains() {
            if ! grep -Fq "$2" "$3"; then
              echo "::error::$1 not found in $3"
              exit 1
            fi
          }

          check_file "FLOW logo" out/assets/web/flow-logo.jpg
          check_file "FLOW compact logo" out/assets/web/flow-compact.jpg
          check_file "FLOW dark logo" out/assets/web/flow-dark.jpg
          check_file "FLOW OG image" out/assets/web/flow-og.jpg
          check_file "FLOW app icon" out/icon.jpg
          check_contains "FLOW logo base path" "${PAGES_BASE_PATH}/assets/web/flow-logo.jpg" out/index.html
          check_contains "FLOW compact base path" "${PAGES_BASE_PATH}/assets/web/flow-compact.jpg" out/index.html
          check_contains "FLOW dark base path" "${PAGES_BASE_PATH}/assets/web/flow-dark.jpg" out/index.html
          check_contains "FLOW OG absolute URL" "https://firmeen.github.io/FLOW-info/assets/web/flow-og.jpg" out/index.html

          for page in \
            out/th/index.html \
            out/th/platform/index.html \
            out/th/solutions/index.html \
            out/th/solutions/foodflow/index.html \
            out/th/solutions/jobflow/index.html \
            out/th/solutions/careflow/index.html \
            out/th/how-it-works/index.html \
            out/th/about/index.html \
            out/th/contact/index.html
          do
            check_file "Thai static route" "$page"
          done

          check_contains "English document language" 'lang="en"' out/index.html
          check_contains "Thai document language" 'lang="th"' out/th/index.html
          check_contains "Thai sitemap routes" '/th' out/sitemap.xml
          check_contains "metadata language alternates" 'languages: languageAlternates(path)' src/lib/metadata.ts
          check_contains "sitemap language alternates" 'alternates: { languages }' src/app/sitemap.ts
          check_contains "Open Graph locale mapping" 'locale === "th" ? "th_TH" : "en_US"' src/lib/metadata.ts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
