name: Validate and deploy FLOW website

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify production brand asset paths
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f out/assets/web/flow-logo.jpg
          test -f out/assets/web/flow-compact.jpg
          test -f out/assets/web/flow-dark.jpg
          test -f out/assets/web/flow-og.jpg
          test -f out/icon.jpg
          grep -Fq "${PAGES_BASE_PATH}/assets/web/flow-logo.jpg" out/index.html
          grep -Fq "${PAGES_BASE_PATH}/assets/web/flow-compact.jpg" out/index.html
          grep -Fq "${PAGES_BASE_PATH}/assets/web/flow-dark.jpg" out/index.html
          grep -Fq "https://firmeen.github.io/FLOW-info/assets/web/flow-og.jpg" out/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
